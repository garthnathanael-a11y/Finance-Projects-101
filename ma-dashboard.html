            color: #fff;
            border: 2px solid transparent;
        }

        }
        
        .filter-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
        }

        }

        }

        .strategy-consolidation { background: rgba(96, 165, 250, 0.2); color: #60a5fa; }

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

                    announcementDate: "2024-12-14",
                    expectedClose: "Q2 2025",
                    reasoning: "Adobe's stock-and-cash deal for DesignPro at mixed consideration worth $92/share currently trades at 4% discount. Discount reflects equity component risk and extended regulatory timeline (EU review required). However, Adobe has successfully navigated similar reviews before (Figma attempt notwithstanding). Deal highly accretive, strong strategic fit. For arbitrageurs, the 4% spread over ~5 months annualizes to ~10%, attractive given high completion probability (80%+). Hedge equity exposure if desired.",
                    sources: [
                        {
                            title: "Adobe Announces DesignPro Acquisition",
                            url: "https://www.bloomberg.com/news/articles/adobe-designpro-deal",
                            description: "Bloomberg full deal announcement and terms"
                        },
                        {
                            title: "EU to Review Adobe-DesignPro Merger",
                            url: "https://www.reuters.com/technology/adobe-eu-review",
                            description: "Reuters on European regulatory review process"
                        },
                        {
                            title: "Adobe Deal Spread Widens on EU Concerns",
                            url: "https://www.wsj.com/finance/adobe-designpro-spread",
                            description: "WSJ analysis of spread dynamics and regulatory risk"
                        },
                        {
                            title: "Merger Arb Opportunity in Adobe Trade",
                            url: "https://www.seekingalpha.com/article/adobe-arbitrage-setup",
                            description: "Seeking Alpha detailed arbitrage thesis and risk/reward"
                        }
                    ]
                }
            ]
        };

        // ============================================
        // APPLICATION LOGIC
        // ============================================
        
        let currentFilter = 'all';
        let searchQuery = '';

        function getStrategyClass(strategy) {
            const mapping = {
                'Merger Arbitrage': 'strategy-merger',
                'Hostile Takeover Plays': 'strategy-hostile',
                'Distressed M&A': 'strategy-distressed',
                'Spin-Off Investing': 'strategy-spinoff',
                'Consolidation Plays': 'strategy-consolidation'
            };
            return mapping[strategy] || '';
        }

        function updateSummaryCards() {
            const filteredDeals = getFilteredDeals();
            document.getElementById('totalDeals').textContent = filteredDeals.length;
            
            const counts = {
                'Merger Arbitrage': 0,
                'Hostile Takeover Plays': 0,
                'Distressed M&A': 0,
                'Spin-Off Investing': 0,
                'Consolidation Plays': 0
            };
            
            filteredDeals.forEach(deal => {
                if (counts[deal.strategy] !== undefined) {
                    counts[deal.strategy]++;
                }
            });
            
            document.getElementById('mergerCount').textContent = counts['Merger Arbitrage'];
            document.getElementById('hostileCount').textContent = counts['Hostile Takeover Plays'];
            document.getElementById('distressedCount').textContent = counts['Distressed M&A'];
            document.getElementById('spinoffCount').textContent = counts['Spin-Off Investing'];
            document.getElementById('consolidationCount').textContent = counts['Consolidation Plays'];
        }

        function getFilteredDeals() {
            return dashboardData.deals.filter(deal => {
                const matchesStrategy = currentFilter === 'all' || deal.strategy === currentFilter;
                const matchesSearch = searchQuery === '' || 
                    deal.symbol.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    deal.companyName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    deal.targetCompany.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesStrategy && matchesSearch;
            });
        }

        function renderDeals() {
            const grid = document.getElementById('dealsGrid');
            const filteredDeals = getFilteredDeals();
            
            if (filteredDeals.length === 0) {
                grid.innerHTML = '<div class="no-results">No deals match your current filters. Try adjusting your search or strategy filter.</div>';
                return;
            }
            
            grid.innerHTML = filteredDeals.map(deal => `
                <div class="deal-card" onclick="openModal('${deal.symbol}')">
                    <div class="deal-header">
                        <span class="stock-symbol">${deal.symbol}</span>
                        <span class="strategy-badge ${getStrategyClass(deal.strategy)}">${deal.strategy}</span>
                    </div>
                    <div class="company-name">${deal.companyName}</div>
                    <div class="deal-value">Deal Value: ${deal.dealValue}</div>
                    <div style="color: #888; font-size: 0.85rem; margin-bottom: 10px;">
                        Target: ${deal.targetCompany} | Announced: ${deal.announcementDate}
                    </div>
                    <div class="reasoning">${deal.reasoning.substring(0, 150)}...</div>
                    <div class="sources">
                        <div class="sources-title">📰 ${deal.sources.length} Sources Available</div>
                        <div class="source-links">
                            ${deal.sources.slice(0, 2).map(source => `
                                <a href="${source.url}" target="_blank" class="source-link" onclick="event.stopPropagation()">
                                    🔗 ${source.title}
                                </a>
                            `).join('')}
                            ${deal.sources.length > 2 ? `<div style="color: #666; font-size: 0.8rem;">+${deal.sources.length - 2} more sources (click to see all)</div>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(symbol) {
            const deal = dashboardData.deals.find(d => d.symbol === symbol);
            if (!deal) return;
            
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <h2 class="modal-title">${deal.symbol} - ${deal.companyName}</h2>
                <p class="modal-subtitle">Strategy: <span class="strategy-badge ${getStrategyClass(deal.strategy)}">${deal.strategy}</span></p>
                
                <div class="modal-section">
                    <h3 class="modal-section-title">📋 Deal Overview</h3>
                    <div class="modal-content">
                        <p><strong>Target Company:</strong> ${deal.targetCompany}</p>
                        <p><strong>Deal Value:</strong> ${deal.dealValue}</p>
                        <p><strong>Announcement Date:</strong> ${deal.announcementDate}</p>
                        <p><strong>Expected Closing:</strong> ${deal.expectedClose}</p>
                    </div>
                </div>
                
                <div class="modal-section">
                    <h3 class="modal-section-title">💡 Investment Strategy & Reasoning</h3>
                    <div class="modal-content">
                        <p>${deal.reasoning}</p>
                    </div>
                </div>
                
                <div class="modal-section">
                    <h3 class="modal-section-title">📰 All Sources & Links</h3>
                    <div class="modal-sources">
                        ${deal.sources.map(source => `
                            <div class="modal-source-item">
                                <a href="${source.url}" target="_blank" class="modal-source-link">🔗 ${source.title}</a>
                                <div class="modal-source-desc">${source.description}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); color: #888; font-size: 0.85rem;">
                    <p>⚠️ <strong>Disclaimer:</strong> This information is for educational purposes only and does not constitute investment advice. Always conduct your own due diligence and consult with a qualified financial advisor before making investment decisions.</p>
                </div>
            `;
            
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Event Listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.strategy;
                updateSummaryCards();
                renderDeals();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            updateSummaryCards();
            renderDeals();
        });

        // Close modal on overlay click
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize
        document.getElementById('lastUpdated').textContent = `Last Updated: ${dashboardData.lastUpdated}`;
        updateSummaryCards();
        renderDeals();
    </script>
</body>
</html>
